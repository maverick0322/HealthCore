<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HealthCore</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f7f7; color: #333333;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e0e0e0;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 40px 0; background-color: #8AA382;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 600; letter-spacing: 1px;">HealthCore</h1>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="margin: 0 0 20px 0; font-size: 22px; color: #EA4335;" th:text="#{appointment.cancelled.title}">Cita Cancelada</h2>
                            
                            <p style="margin: 0 0 20px 0; line-height: 1.6;" th:text="#{appointment.cancelled.message}">Tu cita ha sido cancelada.</p>

                            <div style="margin: 30px 0; padding: 25px; background-color: #fffafa; border-radius: 8px; border: 1px solid #ffcccc;">
                                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                    <tr>
                                        <td style="padding: 5px 0; font-weight: bold; color: #666666;" width="40%" th:text="#{appointment.cancelled.details.id}">ID de Cita:</td>
                                        <td style="padding: 5px 0; color: #333333;" th:text="${appointmentId}">...</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 5px 0; font-weight: bold; color: #666666;" th:text="#{appointment.cancelled.details.original}">Inicio original:</td>
                                        <td style="padding: 5px 0; color: #333333;" th:text="${startTime}">...</td>
                                    </tr>
                                </table>
                            </div>

                            <p style="margin: 0; line-height: 1.6;" th:text="#{welcome.closing}">¡Gracias por elegirnos!</p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 30px; background-color: #fafafa; border-top: 1px solid #eeeeee;">
                            <p style="margin: 0; font-size: 12px; color: #999999; text-transform: uppercase; letter-spacing: 1px;">
                                &copy; 2026 HealthCore. [[#{footer.rights}]]
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
