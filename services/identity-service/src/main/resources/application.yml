spring:
  application:
    name: identity-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_identity}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY_MS:300000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY_MS:86400000}

# Optional OAuth2 provider variables (Auth0 intermediary setup):
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_ID
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_SECRET
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_SCOPE=openid,profile,email
# SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH0_ISSUER_URI=https://YOUR_TENANT.us.auth0.com/

app:
  cors:
    # Comma-separated list for frontend origins (dev examples included)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  manualdb:
    seed:
      enabled: ${APP_MANUALDB_SEED_ENABLED:false}
      patient-email: ${APP_MANUALDB_SEED_PATIENT_EMAIL:patient.seed@healthcore.com}
      patient-password: ${APP_MANUALDB_SEED_PATIENT_PASSWORD:SeedPatient123!}
      nutritionist-email: ${APP_MANUALDB_SEED_NUTRITIONIST_EMAIL:nutritionist.seed@healthcore.com}
      nutritionist-password: ${APP_MANUALDB_SEED_NUTRITIONIST_PASSWORD:SeedNutritionist123!}
  openapi:
    title: ${APP_OPENAPI_TITLE:HealthCore Identity Service API}
    version: ${APP_OPENAPI_VERSION:1.0.0}
    description: ${APP_OPENAPI_DESCRIPTION:Identity and access management endpoints}
    # Use gateway URL when this service is published behind API Gateway
    server-url: ${APP_OPENAPI_SERVER_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

server:
  port: 8082