syntax = "proto3";

package com.healthcore.media.grpc;

option java_multiple_files = true;
option java_package = "com.healthcore.media.infrastructure.grpc.stubs";
option java_outer_classname = "MediaProto";

service MediaServiceGrpc {
  rpc GetPresignedReadUrl (PresignedReadUrlRequest) returns (PresignedReadUrlResponse);
  rpc GetPresignedReadUrls (BatchPresignedReadUrlsRequest) returns (BatchPresignedReadUrlsResponse);
}

message PresignedReadUrlRequest {
  string storageKey = 1;
}

message PresignedReadUrlResponse {
  string presignedUrl = 1;
  string errorMessage = 2;
}

message BatchPresignedReadUrlsRequest {
  repeated string storageKeys = 1;
}

message PresignedReadUrlResult {
  string storageKey = 1;
  string presignedUrl = 2;
  string errorMessage = 3;
}

message BatchPresignedReadUrlsResponse {
  repeated PresignedReadUrlResult results = 1;
}
