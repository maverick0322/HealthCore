name: API Tests CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Newman
        run: npm install -g newman

      - name: Start Services using Docker Compose
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
          echo "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}" >> .env
          echo "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}" >> .env
          echo "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH0_ISSUER_URI=${{ secrets.AUTH0_ISSUER_URI }}" >> .env
          echo "APP_MANUALDB_SEED_ENABLED=true" >> .env
          echo "APP_MANUALDB_SEED_PATIENT_PASSWORD=PostmanSeedPatient123!" >> .env
          echo "APP_MANUALDB_SEED_NUTRITIONIST_PASSWORD=PostmanSeedNutritionist123!" >> .env
          echo "APP_MANUALDB_SEED_ADMIN_PASSWORD=AdminSecureP@ss123!" >> .env

          docker compose up -d mongodb api-gateway identity-service tracking-service clinical-service agenda-service

      - name: Wait for Spring Boot services to be ready behind Nginx
        run: |
          wait_for_logic_response () {
            local name="$1"
            local service="$2"
            local url="$3"
            local accepted_statuses="$4"
            local max_attempts="${5:-18}"
            local attempt=1

            echo "Waiting for ${name} at ${url}..."
            while true; do
              set +e
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              set -e

              STATUS=${STATUS:-000}

              if [[ " ${accepted_statuses} " == *" ${STATUS} "* ]]; then
                echo "${name} is ready with response code: $STATUS"
                break
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "${name} did not become ready in time. Last status: $STATUS"
                echo "--- docker compose ps ${service} ---"
                docker compose ps "${service}" || true
                echo "--- docker compose logs --tail=150 ${service} ---"
                docker compose logs --tail=150 "${service}" || true
                exit 1
              fi

              echo "${name} is not ready yet. Current status: $STATUS. Retrying in 10 seconds..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          wait_for_logic_response "Identity Service" "identity-service" "http://localhost:80/api/v1/auth/register" "405" 18
          wait_for_logic_response "Clinical Service" "clinical-service" "http://localhost:80/api/v1/clinical/profile/me" "401 403" 18
          wait_for_logic_response "Agenda Service" "agenda-service" "http://localhost:80/api/v1/agenda/appointments/me" "401 403" 18

      - name: Run Newman Tests
        working-directory: ./postman
        run: |
          echo "Corriendo pruebas de Identity Service..."
          newman run healthCore_identity_service.postman_collection.json \
            -e healthCore_local.postman_environment.json \
            --bail

          echo "Corriendo pruebas de Agenda Service..."
          newman run healthCore_agenda_service.postman_collection.json \
            -e healthCore_local.postman_environment.json \
            --bail

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Seed Database for Concurrency Test
        run: |
          echo "Ejecutando script de Node para poblar datos..."
          node k6/seed-k6.js

      - name: Run k6 Race Condition Test
        run: |
          echo "Simulando a 5 pacientes agendando el mismo slot al mismo milisegundo..."
          k6 run k6/race-condition.js

      - name: Print Docker Logs on Failure
        if: failure()
        run: |
          echo "========================================="
          echo "ALERTA: PRUEBAS FALLIDAS"
          echo "Imprimiendo logs de los contenedores..."
          echo "========================================="

          echo -e "\n\n---> LOGS DE IDENTITY SERVICE <---"
          docker compose logs --tail=150 identity-service

          echo -e "\n\n---> LOGS DE CLINICAL SERVICE <---"
          docker compose logs --tail=150 clinical-service

          echo -e "\n\n---> LOGS DE AGENDA SERVICE <---"
          docker compose logs --tail=150 agenda-service

          echo -e "\n\n---> LOGS DE API GATEWAY (NGINX) <---"
          docker compose logs --tail=100 api-gateway
