syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.healthcore.agenda.grpc";
option java_outer_classname = "AgendaLifecycleProto";

package agenda;

service AgendaLifecycle {
  rpc CancelFutureAppointmentsForUnlink (CancelFutureAppointmentsForUnlinkRequest) returns (CancelFutureAppointmentsForUnlinkResponse) {}
}

message CancelFutureAppointmentsForUnlinkRequest {
  string patient_id = 1;
  string nutritionist_id = 2;
  string actor = 3;
  string reason = 4;
}

message CancelFutureAppointmentsForUnlinkResponse {
  int32 cancelled_count = 1;
  int32 released_slot_count = 2;
}
