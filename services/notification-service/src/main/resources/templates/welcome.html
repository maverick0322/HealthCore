<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HealthCore</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f7f7; color: #333333;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e0e0e0;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 40px 0; background-color: #8AA382;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 600; letter-spacing: 1px;">HealthCore</h1>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="margin: 0 0 20px 0; font-size: 22px; color: #8AA382;" th:text="#{welcome.title}">Bienvenido</h2>
                            
                            <p style="margin: 0 0 20px 0; line-height: 1.6;" th:text="#{welcome.message}">Estamos muy contentos de tenerte en HealthCore.</p>

                            <div th:if="${verificationRequired}" style="margin: 30px 0; padding: 25px; background-color: #f9fbf9; border: 1px dashed #8AA382; border-radius: 8px; text-align: center;">
                                <p style="margin: 0 0 10px 0; font-size: 14px; color: #666666;" th:text="#{welcome.verification.prompt}">Usa el siguiente código para verificar tu cuenta:</p>
                                <div style="font-size: 32px; font-weight: bold; color: #333333; letter-spacing: 5px;" th:text="${verificationCode}">123456</div>
                                <p style="margin: 15px 0 0 0; font-size: 12px; color: #999999;">
                                    [[#{welcome.verification.expiry.prefix}]] <span th:text="${verificationExpiresAt}">...</span>.
                                </p>
                            </div>

                            <div th:unless="${verificationRequired}" style="margin: 30px 0; text-align: center;">
                                <p style="margin: 0 0 20px 0; line-height: 1.6;" th:text="#{welcome.ready.message}">Tu cuenta está lista para ser usada.</p>
                            </div>

                            <p style="margin: 0; line-height: 1.6;" th:text="#{welcome.closing}">¡Gracias por elegirnos!</p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 30px; background-color: #fafafa; border-top: 1px solid #eeeeee;">
                            <p style="margin: 0; font-size: 12px; color: #999999; text-transform: uppercase; letter-spacing: 1px;">
                                &copy; 2026 HealthCore. [[#{footer.rights}]]
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
