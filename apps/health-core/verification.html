<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8AA382",
                        "background-light": "#f7f7f7",
                        "background-dark": "#181b17",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 px-6 py-4 lg:px-10 bg-white dark:bg-background-dark/50 backdrop-blur-md sticky top-0 z-50">
<div class="flex items-center gap-3 text-slate-900 dark:text-slate-100">
<div class="text-primary">
<span class="material-symbols-outlined text-3xl">shield_person</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight">Nutrition Platform</h2>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center rounded-lg h-10 w-10 bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</header>
<main class="flex flex-1 items-center justify-center p-4 sm:p-6 lg:p-8">
<!-- Main Card -->
<div class="w-full max-w-[480px] bg-white dark:bg-slate-900/50 p-8 sm:p-10 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col items-center">
<!-- Icon Header -->
<div class="mb-8 p-4 bg-primary/10 rounded-full text-primary">
<span class="material-symbols-outlined text-5xl">mail_lock</span>
</div>
<!-- Title & Description -->
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-2">Verifica tu cuenta</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                            Hemos enviado un código de 6 dígitos a tu correo: <br/>
<span class="font-medium text-slate-700 dark:text-slate-300">usuario@ejemplo.com</span>
</p>
</div>
<!-- OTP Input Group -->
<div class="flex flex-col w-full gap-8">
<div class="flex justify-between gap-2 sm:gap-4">
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-transparent focus:border-primary focus:ring-0 transition-all text-slate-900 dark:text-slate-100" maxlength="1" type="number"/>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg transition-colors shadow-lg shadow-primary/20">
                            Verificar
                        </button>
</div>
<!-- Footer Info -->
<div class="mt-8 flex flex-col items-center gap-3">
<div class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-lg">timer</span>
<span>No recibí el código. Reenviar (disponible en 00:59)</span>
</div>
<a class="text-sm font-medium text-primary hover:underline underline-offset-4" href="#">
                            Cambiar dirección de correo
                        </a>
</div>
</div>
</main>
<!-- Aesthetic Footer Detail -->
<footer class="p-6 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">
                    © 2024 Nutrition Platform. Seguridad y Privacidad garantizada.
                </p>
</footer>
</div>
</div>
</body></html>
