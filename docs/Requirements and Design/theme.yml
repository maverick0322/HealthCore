# Configuración de página profesional
page:
  layout: portrait
  margin: [0.75in, 0.75in, 0.75in, 0.75in]
  size: A4

# Encabezados elegantes
header:
  height: 0.6in
  line_height: 1
  font_size: 9
  font_color: 666666
  border_color: 4A90E2
  border_width: 0.5
  recto:
    right:
      content: '{document-title}'
  verso:
    left:
      content: '{document-title}'

# Pies de página
footer:
  height: 0.5in
  font_size: 9
  font_color: 999999
  border_color: DDDDDD
  border_width: 0.25
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'

# Fuentes incluidas con asciidoctor-pdf
font:
  catalog:
    # Noto Sans para texto principal
    NotoSans:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
    
    # M+ Mono para código
    MPlusMono:
      normal: GEM_FONTS_DIR/mplus1mn-regular-subset.ttf
      bold: GEM_FONTS_DIR/mplus1mn-bold-subset.ttf
      italic: GEM_FONTS_DIR/mplus1mn-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/mplus1mn-bold_italic-subset.ttf

# Estilos base
base:
  font_family: NotoSans
  font_size: 10.5
  line_height_length: 14
  line_height: 1.3
  font_color: 2C3E50

# Jerarquía de títulos
heading:
  font_color: 1A5276
  font_style: bold
  h1_font_size: 24
  h1_margin_top: 24
  h1_margin_bottom: 12
  h2_font_size: 18
  h2_margin_top: 18
  h2_margin_bottom: 8
  h3_font_size: 14
  h3_margin_top: 12
  h3_margin_bottom: 6
  h4_font_size: 12
  h4_margin_top: 8
  h4_margin_bottom: 4

# Enlaces
link:
  font_color: 3498DB
  text_decoration: underline

# Bloques de código
code:
  font_family: MPlusMono
  font_size: 9
  font_color: C0392B
  background_color: F8F9F9
  border_color: E5E7E9
  border_width: 0.25
  border_radius: 3
  padding: [4, 6]

# Tablas profesionales
table:
  border_color: D5D8DC
  border_width: 0.5
  cell_padding: 6
  head:
    background_color: 4A90E2
    font_color: FFFFFF
    font_style: bold
    font_size: 10
  body:
    background_color: FFFFFF
    font_color: 2C3E50
    font_size: 9.5
  foot:
    background_color: F2F3F4
    font_color: 7F8C8D
    font_style: italic

# Listas
ulist:
  marker_color: 4A90E2
  indent: 20

olist:
  marker_color: 2C3E50
  indent: 20

# Notas y advertencias
admonition:
  border_width: 0.5
  border_radius: 5
  padding: [8, 12]
  note:
    background_color: E8F4FD
    border_color: 3498DB
  warning:
    background_color: FEF9E7
    border_color: F39C12
  caution:
    background_color: FDEDEC
    border_color: E74C3C

# Captiones
caption:
  font_color: 7F8C8D
  font_size: 8.5
  font_style: italic
  align: center

# Imágenes
image:
  align: center
