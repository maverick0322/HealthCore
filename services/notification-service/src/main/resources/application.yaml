server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  # Disable Spring Security basic auth auto-configuration — this service is purely
  # event-driven (RabbitMQ), so Actuator endpoints should be openly accessible for Prometheus scraping.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false
        default-requeue-rejected: false

app:
  messaging:
    exchange: ${APP_MESSAGING_EXCHANGE:healthcore.identity.events}
    agenda-exchange: ${APP_MESSAGING_AGENDA_EXCHANGE:healthcore.agenda.events}
    dead-letter-exchange: ${APP_MESSAGING_DLX:healthcore.notification.dlx}
    dead-letter-queue-suffix: ${APP_MESSAGING_DLQ_SUFFIX:.dlq}
    queues:
      welcome-email: ${APP_MESSAGING_QUEUE_WELCOME:notification.welcome.email}
      password-reset-email: ${APP_MESSAGING_QUEUE_PASSWORD_RESET:notification.password.reset.email}
      appointment-confirmed-email: ${APP_MESSAGING_QUEUE_APPOINTMENT_CONFIRMED:notification.appointment.confirmed.email}
      appointment-cancelled-email: ${APP_MESSAGING_QUEUE_APPOINTMENT_CANCELLED:notification.appointment.cancelled.email}
      appointment-reminder-email: ${APP_MESSAGING_QUEUE_APPOINTMENT_REMINDER:notification.appointment.reminder.email}
    routing-keys:
      user-registered: ${APP_MESSAGING_ROUTING_USER_REGISTERED:identity.user.registered}
      password-reset-requested: ${APP_MESSAGING_ROUTING_PASSWORD_RESET_REQUESTED:identity.password.reset.requested}
      appointment-confirmed: ${APP_MESSAGING_ROUTING_APPOINTMENT_CONFIRMED:agenda.appointment.confirmed}
      appointment-cancelled: ${APP_MESSAGING_ROUTING_APPOINTMENT_CANCELLED:agenda.appointment.cancelled}
      appointment-reminder: ${APP_MESSAGING_ROUTING_APPOINTMENT_REMINDER:agenda.appointment.reminder}
    listener:
      prefetch-count: ${APP_MESSAGING_LISTENER_PREFETCH_COUNT:5}
      concurrent-consumers: ${APP_MESSAGING_LISTENER_CONCURRENT_CONSUMERS:2}
      max-concurrent-consumers: ${APP_MESSAGING_LISTENER_MAX_CONCURRENT_CONSUMERS:4}
  idempotency:
    sent-ttl: ${APP_NOTIFICATION_IDEMPOTENCY_SENT_TTL:PT24H}
    in-progress-ttl: ${APP_NOTIFICATION_IDEMPOTENCY_IN_PROGRESS_TTL:PT5M}
    max-entries: ${APP_NOTIFICATION_IDEMPOTENCY_MAX_ENTRIES:10000}
  user-directory:
    cache-ttl: ${APP_USER_DIRECTORY_CACHE_TTL:PT10M}
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}
    from-name: ${RESEND_FROM_NAME}

grpc:
  identity:
    target: ${GRPC_IDENTITY_TARGET:localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
