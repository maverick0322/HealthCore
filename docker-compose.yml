services:
  mongodb:
    image: mongo:7.0
    container_name: healthcore-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: healthcore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-healthcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-healthcore}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mongo-express:
    image: mongo-express:latest
    container_name: healthcore-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    image: nginx:alpine
    container_name: healthcore-api-gateway
    ports:
      - "80:80"
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./services/api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity-service:
        condition: service_started
      tracking-service:
        condition: service_started
      agenda-service:
        condition: service_started
      clinical-service:
        condition: service_started
      media-service:
        condition: service_started
    restart: unless-stopped

  catalog-service:
    build: ./services/catalog-service
    container_name: healthcore-catalog-service
    ports:
      - "50051:50051"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=healthcore_catalog
      - FATSECRET_CLIENT_ID=${FATSECRET_CLIENT_ID}
      - FATSECRET_CLIENT_SECRET=${FATSECRET_CLIENT_SECRET}
      - GRPC_PORT=50051
    restart: unless-stopped
  
  identity-service:
    build: ./services/identity-service
    container_name: healthcore-identity-service
    ports:
      - "${SERVER_PORT_IDENTITY:-8082}:8082"
      - "9090:9090"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGGING_LEVEL_COM_HEALTHCORE=DEBUG
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/healthcore_identity
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-healthcore}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS:-healthcore}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_VALIDITY_MS=${JWT_ACCESS_TOKEN_VALIDITY_MS:-300000}
      - JWT_REFRESH_TOKEN_VALIDITY_MS=${JWT_REFRESH_TOKEN_VALIDITY_MS:-86400000}
      - SPRING_AUTOCONFIGURE_EXCLUDE=${SPRING_AUTOCONFIGURE_EXCLUDE-org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_SCOPE=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH0_SCOPE:-openid,profile,email}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH0_ISSUER_URI=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH0_ISSUER_URI}
      - APP_MANUALDB_SEED_ENABLED=${APP_MANUALDB_SEED_ENABLED:-false}
      - APP_MANUALDB_SEED_PATIENT_PASSWORD=${APP_MANUALDB_SEED_PATIENT_PASSWORD:-}
      - APP_MANUALDB_SEED_NUTRITIONIST_PASSWORD=${APP_MANUALDB_SEED_NUTRITIONIST_PASSWORD:-}
      - APP_MANUALDB_SEED_ADMIN_PASSWORD=${APP_MANUALDB_SEED_ADMIN_PASSWORD:-}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
    restart: unless-stopped

  media-service:
    build: ./services/media-service
    container_name: healthcore-media-service
    ports:
      - "${SERVER_PORT_MEDIA:-8088}:8088"
    environment:
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: healthcore-notification-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-healthcore}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS:-healthcore}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - GRPC_IDENTITY_TARGET=identity-service:9090
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${SERVER_PORT_NOTIFICATION:-8086}:8086"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: healthcore-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-service:
    build: ./services/tracking-service
    container_name: healthcore-tracking-service
    ports:
      - "${SERVER_PORT_TRACKING:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      catalog-service:
        condition: service_started
      redis:
        condition: service_healthy
      media-service:
        condition: service_started
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/healthcore_tracking
      - GRPC_CATALOG_TARGET=catalog-service:50051
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_LEVEL_TRACKING=${LOGGING_LEVEL_TRACKING:-DEBUG}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
      - GRPC_CLIENT_MEDIA-SERVICE_ADDRESS=static://media-service:9091
      - GRPC_CLIENT_MEDIA-SERVICE_NEGOTIATION_TYPE=plaintext

  
  agenda-mongodb:
    image: mongo:7.0
    container_name: healthcore-agenda-mongodb
    restart: unless-stopped
    ports:
      - "${AGENDA_MONGO_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${AGENDA_MONGO_DB:-healthcore_agenda}
    volumes:
      - agenda_mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  agenda-mongo-express:
    image: mongo-express:latest
    container_name: healthcore-agenda-mongo-express
    restart: unless-stopped
    ports:
      - "${AGENDA_MONGO_EXPRESS_PORT:-8084}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://agenda-mongodb:27017/
      ME_CONFIG_BASICAUTH: ${AGENDA_MONGO_EXPRESS_BASICAUTH:-false}
    depends_on:
      agenda-mongodb:
        condition: service_healthy

  agenda-service:
    build: ./services/agenda-service
    container_name: healthcore-agenda-service
    restart: unless-stopped
    depends_on:
      agenda-mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://agenda-mongodb:27017/${AGENDA_MONGO_DB:-healthcore_agenda}
      GRPC_CLIENT_CLINICAL_TARGET: ${GRPC_CLIENT_CLINICAL_TARGET:-clinical-service:50051}
      SERVICE_NAME: ${AGENDA_SERVICE_NAME:-AGENDA-SVC}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-healthcore}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-healthcore}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${AGENDA_SERVICE_PORT:-8083}:8080"

  clinical-mongodb:
    image: mongo:7.0
    container_name: healthcore-clinical-mongodb
    restart: unless-stopped
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_DATABASE: healthcore_clinical
    volumes:
      - clinical_mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  clinical-mongo-express:
    image: mongo-express:latest
    container_name: healthcore-clinical-mongo-express
    restart: unless-stopped
    ports:
      - "8085:8081" 
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://clinical-mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      clinical-mongodb:
        condition: service_healthy

  clinical-service:
    build: ./services/clinical-service
    container_name: healthcore-clinical-service
    restart: unless-stopped
    depends_on:
      clinical-mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://clinical-mongodb:27017/healthcore_clinical
      SERVER_PORT: 8083
      GRPC_CLINICAL_PORT: 50051
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

  # ─── OBSERVABILITY STACK ──────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.4.2
    container_name: healthcore-loki
    ports:
      - "3100:3100"
    volumes:
      - ./ops/observability/loki/loki-config.yml:/etc/loki/config.yaml:ro
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: healthcore-promtail
    volumes:
      - ./ops/observability/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: healthcore-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./ops/observability/tempo/tempo-config.yml:/etc/tempo/config.yaml:ro
    command: -config.file=/etc/tempo/config.yaml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: healthcore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: healthcore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-healthcore}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  mongo_data:
  agenda_mongo_data:
  clinical_mongo_data:
  prometheus_data:
  grafana_data:
