name: Release Electron App

on:
  push:
    # Este workflow SOLO se dispara cuando se sube un tag que empiece con "v" (ej. v1.0.0)
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 
          cache: "npm"
          cache-dependency-path: |
            apps/health-core/package-lock.json
            apps/health-core-desktop/package-lock.json

      - name: Instalar dependencias (frontend)
        working-directory: apps/health-core
        run: npm ci

      - name: Instalar dependencias (desktop)
        working-directory: apps/health-core-desktop
        run: npm ci

      - name: Construir y Publicar Release
        working-directory: apps/health-core-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IDENTITY_SERVICE_URL: ${{ vars.VITE_IDENTITY_SERVICE_URL }}
        run: npm run dist
