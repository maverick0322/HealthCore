syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.healthcore.identity.grpc";
option java_outer_classname = "IdentityProto";

package identity;

service IdentityDirectory {
  rpc GetUserContacts (UserContactsRequest) returns (UserContactsResponse) {}
}

message UserContactsRequest {
  repeated string user_ids = 1;
}

message UserContact {
  string user_id = 1;
  string email = 2;
}

message UserContactsResponse {
  repeated UserContact contacts = 1;
}
