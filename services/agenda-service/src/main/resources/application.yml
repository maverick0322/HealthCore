spring:
  application:
    name: agenda-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/healthcore_agenda}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

grpc:
  clinical:
    target: ${GRPC_CLIENT_CLINICAL_TARGET:clinical-service:50051}

agenda:
  default-time-zone: ${AGENDA_DEFAULT_TIME_ZONE:America/Mexico_City}
  confirmation:
    reconcile-delay-ms: ${AGENDA_CONFIRMATION_RECONCILE_DELAY_MS:30000}
  reminders:
    lead-time-hours: ${AGENDA_REMINDER_LEAD_TIME_HOURS:24}
    delay-ms: ${AGENDA_REMINDER_DELAY_MS:86400000}

app:
  messaging:
    exchange: ${APP_MESSAGING_AGENDA_EXCHANGE:healthcore.agenda.events}
    routing-keys:
      appointment-confirmed: ${APP_MESSAGING_ROUTING_APPOINTMENT_CONFIRMED:agenda.appointment.confirmed}
      appointment-cancelled: ${APP_MESSAGING_ROUTING_APPOINTMENT_CANCELLED:agenda.appointment.cancelled}
      appointment-reminder: ${APP_MESSAGING_ROUTING_APPOINTMENT_REMINDER:agenda.appointment.reminder}

security:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
