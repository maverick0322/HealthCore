spring.application.name=tracking-service

jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:300000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:86400000}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/healthcore_tracking}

logging.level.com.healthcore.tracking=${LOGGING_LEVEL_TRACKING:INFO}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_TTL_MS:86400000}
spring.cache.redis.cache-null-values=false

# SpringDoc path pattern compatibility fix for Spring Boot 3.4.x
# The springdoc swagger-ui uses /swagger-ui/**/*swagger-initializer.js which is invalid under PathPatternParser
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Observability
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

grpc.client.media-service.address=static://localhost:9091
grpc.client.media-service.negotiation-type=plaintext

