name: HealthCore CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests (Identity Service)
        working-directory: ./services/identity-service
        run: mvn clean test

      - name: Run Tests (Tracking Service)
        working-directory: ./services/tracking-service
        run: mvn clean test